{% extends 'base.html' %}
{% block content %}
<div class="p-3">
    <div class="container">
        <div class="col mx-auto mb-3">
            <h2>Messages</h2>
            <hr />
        </div>
        <div class="row">
            {% for message in template_data.messages %}
            <div class="col-md-4 col-lg-3 mb-2">
                <div class="p-2 card align-items-center pt-4">
                    <div class="card-body text-center">
                        <p class="fw-bold text-primary">Message from: {{ message.sender.username}}</p>
                        <p class="text-end text-muted"> {{ message.timestamp}} </p>
                        <div class="card-body text-start">
                            {{ message.content }}
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12">
                <p class="text-muted">No messages found.</p>
            </div>
            {% endfor %}
            <div class="card-footer bg-white p-3 border-top">
                <form method="POST" action="{% url 'messaging.send_message' recipient.id %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="recipient_username" class="form-label fw-bold">Recipient: </label>
                        <input type="text" name="recipient_username" id="recipient_username" class="form-control" placeholder="Enter Recipient Username" required>
                    </div>
                    <textarea name="content" class="form-control" rows="1" placeholder="Type your message here" required></textarea>
                    <button>Send</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
