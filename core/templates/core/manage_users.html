<h1>Manage Users</h1>
<table border="1" cellpadding="8">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Active</th>
        <th>Action</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.is_active }}</td>
        <td>
            <form method="post" action="{% url 'toggle_user_active' user.id %}">
                {% csrf_token %}
                <button type="submit">
                    {% if user.is_active %}Deactivate{% else %}Activate{% endif %}
                </button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
