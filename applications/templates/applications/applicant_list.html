<h1>Applicants</h1>
<table border="1" cellpadding="8">
    <tr>
        <th>Applicant</th>
        <th>Job</th>
        <th>Status</th>
        <th>Applied</th>
        <th></th>
    </tr>
    {% for app in applications %}
    <tr>
        <td>{{ app.applicant.fullName }}</td>
        <td>{{ app.job.title }}</td>
        <td>{{ app.status }}</td>
        <td>{{ app.applied_at }}</td>
        <td><a href="{% url 'review_application' app.id %}">Review</a></td>
    </tr>
    {% endfor %}
</table>
